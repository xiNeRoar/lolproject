kind = "web"
previewPath = "/"
title = "Vancouver Competitive LoL Project"
version = "1.0.0"
id = "artifacts/vclol"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20211
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/vclol run dev"

[services.env]
PORT = "20211"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/vclol", "run", "build"]
publicDir = "artifacts/vclol/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
