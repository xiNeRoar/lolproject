    description: "Dark, moody, abstract geometric background with subtle steel blue glowing lines, conveying a serious competitive esports/gaming atmosphere without being tacky. High contrast, mostly charcoal and black."
    aspect_ratio: "16:9"

notes:
  - The API hooks are imported from @workspace/api-client-react
  - Admin authentication relies on HTTP-only cookies
