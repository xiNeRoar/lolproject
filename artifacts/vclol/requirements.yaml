packages:
  "framer-motion": "For page transitions and smooth UI animations matching the premium aesthetic"
  "@hookform/resolvers": "Zod validation integration with react-hook-form"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility to merge tailwind classes without style conflicts"
  "date-fns": "For formatting event dates nicely"
  "lucide-react": "For crisp, consistent iconography across the app"

images:
