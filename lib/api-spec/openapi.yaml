# ─────────────────────────────────────────────────────────────
# SCHEMAS
# ─────────────────────────────────────────────────────────────

  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Global search across teams, players, events
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        id:
                          type: integer
                        name:
                          type: string
                        tag:
                          type: string
                        teamElo:
                          type: integer
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        id:
                          type: integer
                        riotId:
                          type: string
                        primaryRole:
                          type: string
                          nullable: true
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        id:
                          type: integer
                        title:
                          type: string
                        slug:
                          type: string
                        format:
                          type: string
                          nullable: true
        "400":
          description: Query too short


components:
  schemas:

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    # ── Admin ─────────────────────────────────────────────────

    AdminLoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AdminLoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    AdminMeResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        email:
          type: string
      required: [authenticated]

    AdminStats:
      type: object
      properties:
        teams:
          type: integer
        players:
          type: integer
        events:
          type: integer
        registrations:
          type: integer
        matches:
          type: integer
        vods:
          type: integer
        seasons:
          type: integer
      required: [teams, players, events, registrations, matches, vods, seasons]

    AuthMeResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        playerId:
          type: integer
          nullable: true
        riotId:
          type: string
          nullable: true
        discordUsername:
          type: string
          nullable: true
      required: [authenticated]

    # ── Team ──────────────────────────────────────────────────

    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        tag:
          type: string
        captainPlayerId:
          type: integer
        discordServerId:
          type: string
          nullable: true
        teamElo:
          type: integer
        peakElo:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        isActive:
          type: boolean
        defaultMatchVisibility:
          type: string
          description: "private | participants | public"
        lastMatchAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, tag, captainPlayerId, teamElo, peakElo, wins, losses, isActive, createdAt, updatedAt]

    CreateTeamRequest:
      type: object
      properties:
        name:
          type: string
        tag:
          type: string
        captainPlayerId:
          type: integer
        discordServerId:
          type: string
          nullable: true
        teamElo:
          type: integer
          nullable: true
        isActive:
          type: boolean
          nullable: true
      required: [name, tag, captainPlayerId]

    TeamProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        tag:
          type: string
        captainPlayerId:
          type: integer
        teamElo:
          type: integer
        peakElo:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        isActive:
          type: boolean
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        recentMatches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, tag, captainPlayerId, teamElo, peakElo, wins, losses, isActive, members, recentMatches, createdAt, updatedAt]

    TeamMember:
      type: object
      properties:
        id:
          type: integer
        teamId:
          type: integer
        playerId:
          type: integer
        playerRiotId:
          type: string
          nullable: true
        playerDiscordUsername:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        status:
          type: string
        joinedAt:
          type: string
      required: [id, teamId, playerId, status, joinedAt]

    # ── Player ────────────────────────────────────────────────

    Player:
      type: object
      properties:
        id:
          type: integer
        riotId:
          type: string
        discordUsername:
          type: string
        primaryTeam:
          type: object
          nullable: true
          properties:
            teamId:
              type: integer
            teamName:
              type: string
            teamTag:
              type: string
        totalGames:
          type: integer
        winRate:
          type: integer
          nullable: true
        discordId:
          type: string
          nullable: true
        puuid:
          type: string
          nullable: true
        primaryRole:
          type: string
          nullable: true
        secondaryRole:
          type: string
          nullable: true
        isActive:
          type: boolean
        email:
          type: string
          nullable: true
        notificationPreference:
          type: string
          nullable: true
        registrationStatus:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, riotId, discordUsername, isActive, createdAt, updatedAt]

    CreatePlayerRequest:
      type: object
      properties:
        riotId:
          type: string
        discordUsername:
          type: string
        discordId:
          type: string
          nullable: true
        puuid:
          type: string
          nullable: true
        primaryRole:
          type: string
          nullable: true
        secondaryRole:
          type: string
          nullable: true
        isActive:
          type: boolean
          nullable: true
        email:
          type: string
          nullable: true
        notificationPreference:
          type: string
          nullable: true
        registrationStatus:
          type: string
          nullable: true
      required: [riotId, discordUsername]

    RegisterPlayerRequest:
      type: object
      properties:
        riotId:
          type: string
        discordId:
          type: string
        discordUsername:
          type: string
        puuid:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      required: [riotId, discordId, discordUsername]

    UpdatePlayerProfileRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        notificationPreference:
          type: string
          nullable: true
        primaryRole:
          type: string
          nullable: true
        secondaryRole:
          type: string
          nullable: true

    PlayerProfile:
      type: object
      properties:
        id:
          type: integer
        riotId:
          type: string
        discordUsername:
          type: string
        puuid:
          type: string
          nullable: true
        primaryRole:
          type: string
          nullable: true
        secondaryRole:
          type: string
          nullable: true
        isActive:
          type: boolean
        teams:
          type: array
          items:
            $ref: "#/components/schemas/PlayerTeamEntry"
        aggregateStats:
          $ref: "#/components/schemas/PlayerAggregateStats"
        recentMatches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        vods:
          type: array
          items:
            $ref: "#/components/schemas/VodEntry"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, riotId, discordUsername, isActive, teams, aggregateStats, recentMatches, vods, createdAt, updatedAt]

    PlayerTeamEntry:
      type: object
      properties:
        teamId:
          type: integer
        teamName:
          type: string
        teamTag:
          type: string
        role:
          type: string
          nullable: true
        status:
          type: string
        isCaptain:
          type: boolean
      required: [teamId, teamName, teamTag, status, isCaptain]

    PlayerAggregateStats:
      type: object
      properties:
        totalGames:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        avgKills:
          type: number
        avgDeaths:
          type: number
        avgAssists:
          type: number
        avgCs:
          type: number
        topChampions:
          type: array
